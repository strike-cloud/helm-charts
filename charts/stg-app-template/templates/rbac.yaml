{{- if .Values.noInterrupt.enabled }}
{{- $name := printf "%s-no-interrupt" .Values.appName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    component: no-interrupt
    env: {{ .Values.envShort }}
  annotations:
    # Delete after the Deployment stops using it.
    argocd.argoproj.io/sync-options: PruneLast=true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    component: no-interrupt
    env: {{ .Values.envShort }}
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    component: no-interrupt
    env: {{ .Values.envShort }}
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
